name: Enterprise CD Preparation

on:
  workflow_dispatch: # Manual trigger for deployment preparation

jobs:
  build-and-push-acr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          cd backend
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/footfalls-backend:${{ github.sha }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/footfalls-backend:${{ github.sha }}

  prepare-aks-deployment:
    runs-on: ubuntu-latest
    needs: build-and-push-acr
    steps:
      - name: Set AKS Context (Dry Run)
        run: echo "Deployment to AKS must be triggered manually via K8s Guide."
