apiVersion: v1
kind: Secret
metadata:
  name: footfalls-secrets
  namespace: footfalls-production
type: Opaque
stringData:
  # Base64 encoding is automatic with stringData. In real deployments, inject from Azure Key Vault or CI/CD
  MONGO_URI: "mongodb+srv://placeholder:placeholder@cluster0.mongodb.net/?retryWrites=true&w=majority"
  JWT_SECRET: "replace_with_production_jwt_secret"
  FIREBASE_PROJECT_ID: "replace_with_firebase_project_id"
  FIREBASE_API_KEY: "replace_with_firebase_api_key"
