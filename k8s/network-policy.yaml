apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: footfalls-backend-policy
  namespace: footfalls-production
spec:
  podSelector:
    matchLabels:
      app: footfalls-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - {} # Allow all egress for MongoDB Atlas and Firebase APIs
