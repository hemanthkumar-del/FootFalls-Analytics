version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: footfalls_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=footfalls_db
      - CORS_ORIGINS=*
      # Inject FIREBASE_PROJECT_ID via your host shell or local .env
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: footfalls_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
